<svg xmlns="http://www.w3.org/2000/svg" width="410" height="148" viewBox="0 0 410 148" role="img" aria-label="Lacuna — Local-first Windows notebook for calm writing,">
  <rect x="0.5" y="0.5" width="409" height="147" rx="10" fill="#FFFFFF" stroke="#D0D7DE" />

  <!-- Top Row: Number/Category + External Arrow -->
  <g transform="translate(20, 26)">
