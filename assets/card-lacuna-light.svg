  <!-- Project Title -->
  <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.01em" fill="#1F2328">Lacuna</text>

